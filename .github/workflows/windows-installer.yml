# 发布新版本（GitHub Release）时，自动打包 Windows 一键安装包并上传到这个 Release。
# 也可以在 Actions 页面手动运行：填上版本号（例如 v1.0.7）就给那个 Release 补上安装包；
# 留空则只打包，安装包出现在运行结果的 Artifacts 里。
name: Windows 安装包

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "给哪个版本补安装包（例如 v1.0.7）；留空只打包不上传"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: 打包
        shell: pwsh
        run: ./installer/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
      - name: 上传到 Release
        if: github.event_name == 'release' || inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$env:TAG" (Get-ChildItem dist/*.exe).FullName --clobber --repo "${{ github.repository }}"
